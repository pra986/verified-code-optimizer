[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "verified-code-optimizer"
version = "0.1.0"
description = "Correctness-gated Python-to-C++ benchmark portfolio demo"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
include = ["optimizer*"]
[tool.setuptools.package-data]
optimizer = ["static/*.html"]
